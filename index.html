<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZENTRO GARAGE</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!-- CHARGEMENT -->
    <div id="loading">
        <div class="loading-logo">ZENTRO</div>
        <div class="loading-subtitle">GARAGE PERFORMANCE HQ</div>

        <div class="loading-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="loading-text">CHARGEMENT DU GARAGE...</div>
    </div>

    <!-- INTERFACE SUPÉRIEURE -->
    <header class="topbar">

        <div class="logo">
            ZENTRO
        </div>

        <div class="location">
            GARAGE
            <span>PERFORMANCE HQ</span>
        </div>

        <div class="credits">
            <span>CRÉDITS</span>
            <strong>125 000 €</strong>
        </div>

    </header>


    <!-- INFORMATIONS VOITURE -->
    <section class="car-info">

        <div class="small-title">
            VÉHICULE SÉLECTIONNÉ
        </div>

        <h1>GOLF R</h1>

        <div class="edition">
            2025 • BLACK EDITION
        </div>

        <div class="line"></div>

        <div class="stats">

            <div>
                <span>PUISSANCE</span>
                <strong>333 CH</strong>
            </div>

            <div>
                <span>0-100 KM/H</span>
                <strong>4.6 S</strong>
            </div>

            <div>
                <span>VITESSE MAX</span>
                <strong>270 KM/H</strong>
            </div>

            <div>
                <span>TRANSMISSION</span>
                <strong>4MOTION</strong>
            </div>

        </div>

        <button id="driveButton" class="primary-button">
            🚗 PRENDRE LE VOLANT
        </button>

        <button id="customButton" class="secondary-button">
            ⚙ PERSONNALISER
        </button>

    </section>


    <!-- PANNEAU DE PERSONNALISATION -->
    <section id="customPanel">

        <div class="panel-header">

            <div>
                <span>ATELIER</span>
                <h2>PERSONNALISATION</h2>
            </div>

            <button id="closeCustom">
                ×
            </button>

        </div>


        <div class="custom-block">

            <label>COULEUR CARROSSERIE</label>

            <div class="colors">

                <button
                    class="color active"
                    data-color="#08090b"
                    style="background:#08090b">
                </button>

                <button
                    class="color"
                    data-color="#eeeeee"
                    style="background:#eeeeee">
                </button>

                <button
                    class="color"
                    data-color="#9b1018"
                    style="background:#9b1018">
                </button>

                <button
                    class="color"
                    data-color="#123a70"
                    style="background:#123a70">
                </button>

            </div>

        </div>


        <div class="custom-block">

            <label>JANTES</label>

            <div class="options">

                <button class="option active">
                    NOIR
                </button>

                <button class="option">
                    ARGENT
                </button>

            </div>

        </div>


        <div class="custom-block">

            <label>ÉCLAIRAGE</label>

            <div class="options">

                <button class="option active">
                    BLANC
                </button>

                <button class="option">
                    BLEU
                </button>

            </div>

        </div>

    </section>


    <!-- INDICATIONS -->
    <div class="controls">

        <span>🖱️ GLISSER</span>
        <span>MOLETTE • ZOOM</span>
        <span>ESC • MENU</span>

    </div>


    <!-- NOTIFICATION -->
    <div id="notification"></div>


    <script type="module" src="main.js"></script>

</body>
</html>
